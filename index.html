<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    UNKNOWN FILES AI AGENT
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #08090d;

      color: white;

      min-height: 100vh;

    }


    .container {

      width:
        min(900px, 92%);

      margin:
        0 auto;

      padding:
        50px 0 80px;

    }


    h1 {

      font-size: 42px;

      margin-bottom: 8px;

    }


    .subtitle {

      color: #999;

      margin-bottom: 40px;

      font-size: 17px;

    }


    .card {

      background:
        #11131a;

      border:
        1px solid #272a34;

      border-radius:
        20px;

      padding:
        25px;

      margin-bottom:
        25px;

    }


    label {

      display:
        block;

      margin-bottom:
        10px;

      font-weight:
        bold;

    }


    textarea {

      width:
        100%;

      min-height:
        130px;

      background:
        #08090d;

      color:
        white;

      border:
        1px solid #30333d;

      border-radius:
        14px;

      padding:
        15px;

      font-size:
        16px;

      resize:
        vertical;

      outline:
        none;

    }


    textarea:focus {

      border-color:
        #777;

    }


    button {

      width:
        100%;

      margin-top:
        18px;

      padding:
        18px;

      border:
        0;

      border-radius:
        14px;

      font-size:
        18px;

      font-weight:
        bold;

      cursor:
        pointer;

      background:
        white;

      color:
        black;

    }


    button:disabled {

      opacity:
        0.5;

      cursor:
        not-allowed;

    }


    .status {

      margin-top:
        20px;

      padding:
        16px;

      border-radius:
        12px;

      background:
        #191b23;

      color:
        #ccc;

      white-space:
        pre-wrap;

      line-height:
        1.5;

    }


    .story {

      line-height:
        1.7;

      color:
        #ddd;

      white-space:
        pre-wrap;

    }


    .audio {

      width:
        100%;

      margin-top:
        15px;

    }


    .images {

      display:
        grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap:
        15px;

      margin-top:
        20px;

    }


    .scene {

      background:
        #08090d;

      border-radius:
        14px;

      overflow:
        hidden;

      border:
        1px solid #292c35;

    }


    .scene img {

      width:
        100%;

      display:
        block;

    }


    .scene-title {

      padding:
        12px;

      color:
        #aaa;

      font-size:
        14px;

    }


    .video-wrapper {

      margin-top:
        20px;

      background:
        #08090d;

      border-radius:
        16px;

      overflow:
        hidden;

      border:
        1px solid #292c35;

    }


    .video-wrapper video {

      width:
        100%;

      display:
        block;

      max-height:
        750px;

      background:
        black;

    }


    .download-btn {

      display:
        block;

      width:
        100%;

      margin-top:
        18px;

      padding:
        17px;

      border-radius:
        14px;

      background:
        white;

      color:
        black;

      text-align:
        center;

      text-decoration:
        none;

      font-weight:
        bold;

      font-size:
        17px;

    }


    .hidden {

      display:
        none;

    }


    .success {

      color:
        #7cff9b;

    }


    .error {

      color:
        #ff7777;

    }


    @media (
      max-width: 600px
    ) {

      h1 {

        font-size:
          32px;

      }


      .images {

        grid-template-columns:
          1fr;

      }


      .container {

        padding-top:
          30px;

      }

    }

  </style>

</head>


<body>


  <div class="container">


    <h1>
      UNKNOWN FILES
    </h1>


    <div class="subtitle">

      AI-powered mystery &
      psychological horror
      video agent

    </div>


    <!-- STORY INPUT -->

    <div class="card">


      <label for="topic">

        Story idea

      </label>


      <textarea
        id="topic"
        placeholder="Example: A security camera recorded a man entering an abandoned house, but nobody ever saw him leave."
      ></textarea>


      <button id="createBtn">

        🎬 CREATE STORY

      </button>


      <div
        id="status"
        class="status hidden"
      ></div>


    </div>


    <!-- STORY -->

    <div
      id="storyCard"
      class="card hidden"
    >

      <h2>
        📖 Story
      </h2>


      <div
        id="story"
        class="story"
      ></div>

    </div>


    <!-- AUDIO -->

    <div
      id="audioCard"
      class="card hidden"
    >

      <h2>
        🎙️ Voice
      </h2>


      <audio
        id="audio"
        class="audio"
        controls
      ></audio>

    </div>


    <!-- IMAGES -->

    <div
      id="imagesCard"
      class="card hidden"
    >

      <h2>
        🎬 Generated Scenes
      </h2>


      <div
        id="images"
        class="images"
      ></div>

    </div>


    <!-- VIDEO -->

    <div
      id="videoCard"
      class="card hidden"
    >

      <h2>
        🎥 Final MP4
      </h2>


      <div
        class="video-wrapper"
      >

        <video
          id="videoPlayer"
          controls
          playsinline
          preload="metadata"
        ></video>

      </div>


      <a
        id="downloadVideo"
        class="download-btn"
        href="#"
      >

        ⬇️ DOWNLOAD MP4

      </a>

    </div>


  </div>


<script>


// ==================================================
// API
// ==================================================

const API =
  "https://unknown-files-agent.gh4sy6ngr6.workers.dev";


// ==================================================
// ELEMENTS
// ==================================================

const createBtn =
  document.getElementById(
    "createBtn"
  );


const topicInput =
  document.getElementById(
    "topic"
  );


const statusBox =
  document.getElementById(
    "status"
  );


const storyCard =
  document.getElementById(
    "storyCard"
  );


const storyBox =
  document.getElementById(
    "story"
  );


const audioCard =
  document.getElementById(
    "audioCard"
  );


const audio =
  document.getElementById(
    "audio"
  );


const imagesCard =
  document.getElementById(
    "imagesCard"
  );


const imagesBox =
  document.getElementById(
    "images"
  );


const videoCard =
  document.getElementById(
    "videoCard"
  );


const videoPlayer =
  document.getElementById(
    "videoPlayer"
  );


const downloadVideo =
  document.getElementById(
    "downloadVideo"
  );


let currentVideoURL =
  null;


// ==================================================
// STATUS
// ==================================================

function showStatus(
  message,
  type = ""
) {

  statusBox.className =
    "status";


  if (type) {

    statusBox.classList.add(
      type
    );

  }


  statusBox.textContent =
    message;


  statusBox.classList.remove(
    "hidden"
  );

}


// ==================================================
// BASE64 → BLOB
// ==================================================

function base64ToBlob(
  base64,
  mimeType
) {

  const byteCharacters =
    atob(base64);


  const sliceSize =
    1024 * 1024;


  const byteArrays =
    [];


  for (
    let offset = 0;
    offset <
    byteCharacters.length;
    offset += sliceSize
  ) {

    const slice =
      byteCharacters.slice(
        offset,
        offset + sliceSize
      );


    const byteNumbers =
      new Uint8Array(
        slice.length
      );


    for (
      let i = 0;
      i < slice.length;
      i++
    ) {

      byteNumbers[i] =
        slice.charCodeAt(i);

    }


    byteArrays.push(
      byteNumbers
    );

  }


  return new Blob(
    byteArrays,
    {
      type: mimeType
    }
  );

}


// ==================================================
// RESET
// ==================================================

function hideResults() {


  storyCard.classList.add(
    "hidden"
  );


  audioCard.classList.add(
    "hidden"
  );


  imagesCard.classList.add(
    "hidden"
  );


  videoCard.classList.add(
    "hidden"
  );


  storyBox.textContent =
    "";


  audio.removeAttribute(
    "src"
  );


  audio.load();


  imagesBox.innerHTML =
    "";


  videoPlayer.pause();


  videoPlayer.removeAttribute(
    "src"
  );


  videoPlayer.load();


  downloadVideo.removeAttribute(
    "href"
  );


  if (currentVideoURL) {

    URL.revokeObjectURL(
      currentVideoURL
    );

    currentVideoURL =
      null;

  }

}


// ==================================================
// CREATE STORY
// ==================================================

createBtn.addEventListener(

  "click",

  async () => {


    const topic =
      topicInput.value.trim();


    if (!topic) {

      showStatus(
        "Please enter a story idea first.",
        "error"
      );

      return;

    }


    hideResults();


    createBtn.disabled =
      true;


    try {


      // ==================================================
      // STEP 1
      // ==================================================

      showStatus(
        "🧠 Creating the story..."
      );


      const storyResponse =
        await fetch(

          `${API}/api/create-story`,

          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify({
                topic
              })

          }

        );


      const storyData =
        await storyResponse.json();


      if (
        !storyResponse.ok ||
        !storyData.success
      ) {

        throw new Error(

          storyData.error ||
          "Story generation failed."

        );

      }


      const story =
        storyData.story;


      if (!story) {

        throw new Error(
          "No story was returned."
        );

      }


      storyBox.textContent =
        story;


      storyCard.classList.remove(
        "hidden"
      );


      // ==================================================
      // STEP 2
      // ==================================================

      showStatus(

        "🎙️ Generating voice...\n\n" +

        "🎬 Generating 4 DIFFERENT scenes...\n\n" +

        "🎥 Preparing MP4...\n\n" +

        "⏳ Please wait..."

      );


      const assetsResponse =
        await fetch(

          `${API}/api/create-assets`,

          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify({
                story
              })

          }

        );


      const assetsData =
        await assetsResponse.json();


      if (
        !assetsResponse.ok ||
        !assetsData.success
      ) {

        throw new Error(

          assetsData.error ||
          "Asset generation failed."

        );

      }


      // ==================================================
      // AUDIO
      // ==================================================

      if (

        assetsData.audio &&
        assetsData.audio.url

      ) {

        audio.src =
          assetsData.audio.url;


        audioCard.classList.remove(
          "hidden"
        );

      }


      // ==================================================
      // SHOW 4 IMAGES
      // ==================================================

      if (

        Array.isArray(
          assetsData.images
        )

      ) {


        imagesBox.innerHTML =
          "";


        for (

          const scene
          of assetsData.images

        ) {


          const wrapper =
            document.createElement(
              "div"
            );


          wrapper.className =
            "scene";


          const img =
            document.createElement(
              "img"
            );


          img.src =
            scene.image;


          img.alt =
            `Scene ${scene.scene}`;


          const title =
            document.createElement(
              "div"
            );


          title.className =
            "scene-title";


          title.textContent =
            `SCENE ${scene.scene}`;


          wrapper.appendChild(
            img
          );


          wrapper.appendChild(
            title
          );


          imagesBox.appendChild(
            wrapper
          );

        }


        imagesCard.classList.remove(
          "hidden"
        );

      }


      // ==================================================
      // FINAL MP4
      // ==================================================

      if (

        assetsData.video &&
        assetsData.video.base64

      ) {


        showStatus(

          "🎥 MP4 received...\n\n" +

          "⏳ Preparing video..."

        );


        // ==================================================
        // BASE64 → REAL BLOB
        // ==================================================

        const videoBlob =
          base64ToBlob(

            assetsData.video.base64,

            "video/mp4"

          );


        if (
          !videoBlob ||
          videoBlob.size === 0
        ) {

          throw new Error(
            "Generated MP4 is empty."
          );

        }


        console.log(
          "VIDEO SIZE:",
          videoBlob.size
        );


        // ==================================================
        // OBJECT URL
        // ==================================================

        currentVideoURL =
          URL.createObjectURL(
            videoBlob
          );


        // ==================================================
        // VIDEO PLAYER
        // ==================================================

        videoPlayer.src =
          currentVideoURL;


        videoPlayer.load();


        // ==================================================
        // DOWNLOAD
        // ==================================================

        downloadVideo.href =
          currentVideoURL;


        downloadVideo.download =
          "UNKNOWN_FILES.mp4";


        // ==================================================
        // SHOW VIDEO
        // ==================================================

        videoCard.classList.remove(
          "hidden"
        );


        setTimeout(
          () => {

            videoCard.scrollIntoView({

              behavior:
                "smooth",

              block:
                "start"

            });

          },

          300

        );


        showStatus(

          "✅ VIDEO CREATED!\n\n" +

          "Story ✓\n" +

          "Voice ✓\n" +

          "Scene 1 ✓\n" +

          "Scene 2 ✓\n" +

          "Scene 3 ✓\n" +

          "Scene 4 ✓\n" +

          "FFmpeg ✓\n" +

          "MP4 ✓",

          "success"

        );

      }

      else {

        throw new Error(

          "The Worker completed asset generation, but no MP4 was returned."

        );

      }


    }

    catch (error) {


      console.error(
        "UNKNOWN FILES ERROR:",
        error
      );


      showStatus(

        "❌ ERROR\n\n" +

        (
          error.message ||
          String(error)
        ),

        "error"

      );

    }


    finally {

      createBtn.disabled =
        false;

    }

  }

);

</script>

</body>

</html>
