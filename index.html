<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Test</title>

  <style>
    body {
      margin: 0;
      background: #08090d;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      width: 90%;
      max-width: 500px;
      background: #12141a;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 18px;
      border: 0;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #08090d;
      border-radius: 12px;
      white-space: pre-wrap;
      text-align: left;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🤖 Workers AI Test</h1>

    <p>Test Qwen3 connection</p>

    <button onclick="testAI()" id="button">
      TEST AI
    </button>

    <div id="result">
      Waiting...
    </div>

  </div>

  <script>
    async function testAI() {

      const button =
        document.getElementById("button");

      const result =
        document.getElementById("result");

      button.disabled = true;

      result.textContent =
        "⏳ Testing AI...";

      try {

        const response =
          await fetch("/api/test-ai", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            }
          });

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "AI test failed"
          );
        }

        result.textContent =
          "✅ AI WORKS\n\n" +
          JSON.stringify(
            data,
            null,
            2
          );

      } catch (error) {

        result.textContent =
          "❌ FAILED\n\n" +
          error.message;

      }

      button.disabled = false;
    }
  </script>

</body>
</html>
