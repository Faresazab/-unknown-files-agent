<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Model Tester</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #08090d;
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding: 30px 18px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 20px;
      border: 0;
      border-radius: 16px;
      background: white;
      color: black;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    .status {
      margin-top: 20px;
      padding: 18px;
      border-radius: 16px;
      background: #12141a;
      border: 1px solid #22252d;
    }

    .results {
      margin-top: 20px;
      padding: 18px;
      border-radius: 16px;
      background: #12141a;
      border: 1px solid #22252d;
      display: none;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      color: #ccc;
      font-size: 13px;
      line-height: 1.5;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #35d07f;
      border-radius: 50%;
      margin-right: 8px;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>AI Model Tester</h1>

    <div class="subtitle">
      Testing Workers AI models individually.
    </div>

    <button
      id="testButton"
      onclick="testModels()"
    >
      🧪 Test AI Models
    </button>

    <div class="status">

      <div id="statusText">
        <span class="dot"></span>
        Ready for test...
      </div>

    </div>

    <div
      id="resultsBox"
      class="results"
    >

      <pre id="resultsText"></pre>

    </div>

  </div>


<script>

async function testModels() {

  const button =
    document.getElementById(
      "testButton"
    );

  const status =
    document.getElementById(
      "statusText"
    );

  const resultsBox =
    document.getElementById(
      "resultsBox"
    );

  const resultsText =
    document.getElementById(
      "resultsText"
    );


  button.disabled = true;

  resultsBox.style.display =
    "none";

  status.innerHTML =
    '<span class="dot"></span> 🔄 Testing Qwen3, Qwen Image and Grok TTS...';


  try {

    const response =
      await fetch(
        "/api/test-models",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          }
        }
      );


    const data =
      await response.json();


    resultsText.textContent =
      JSON.stringify(
        data,
        null,
        2
      );

    resultsBox.style.display =
      "block";


    if (
      data.qwen3 &&
      data.qwen3.success
    ) {

      status.innerHTML =
        '<span class="dot"></span> ✅ Test completed. Check results below.';

    } else {

      status.innerHTML =
        '<span class="dot"></span> ⚠️ One or more models failed.';

    }

  } catch (error) {

    status.innerHTML =
      '<span class="dot"></span> ❌ ' +
      error.message;

  }


  button.disabled = false;

}

</script>

</body>
</html>
